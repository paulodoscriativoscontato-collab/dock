name: Gerar versao

# Rode assim, depois de subir o codigo:   git tag v1.0.1  &&  git push origin v1.0.1
# O GitHub monta o Dock.exe + Dock-Setup.exe sozinho e publica no "Releases". As docks ja instaladas
# percebem a versao nova e se atualizam.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir se a tag bate com a VERSAO do dock.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $linha = Select-String -Path dock.py -Pattern '^VERSAO = "(.+?)"' | Select-Object -First 1
          $versao = $linha.Matches[0].Groups[1].Value
          if ($tag -ne $versao) { throw "A tag v$tag nao bate com VERSAO = `"$versao`" no dock.py. Corrija e crie a tag de novo." }
          if (-not (Select-String -Path dock.py -Pattern '^GITHUB_REPO = "[^"/]+/[^"/]+"')) { throw "Preencha GITHUB_REPO no dock.py (ex.: ""usuario/Dock"")." }

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar Dock.exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name Dock --icon icon.ico dock.py

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\Dock.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o instalador" }
          $h = (Get-FileHash installer\Output\Dock-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Dock-Setup.exe" | Out-File -Encoding ascii installer\Output\Dock-Setup.exe.sha256

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/Dock-Setup.exe
            installer/Output/Dock-Setup.exe.sha256
          generate_release_notes: true
